  <text class="m" x="24" y="54" font-size="12">~600k lines added across 2,800+ commits · 2020 – today</text>
  <clipPath id="c"><rect x="24" y="70" width="447" height="10" rx="5"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="24" y="70" width="317" height="10" fill="#dea584"/>
    <rect x="341" y="70" width="108" height="10" fill="#3178c6"/>
    <rect x="449" y="70" width="11" height="10" fill="#336791"/>
    <rect x="460" y="70" width="7" height="10" fill="#7b42bc"/>
    <rect x="467" y="70" width="4" height="10" fill="#8b949e"/>
  </g>
  <g font-size="12">
