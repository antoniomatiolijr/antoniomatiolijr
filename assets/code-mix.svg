    <circle cx="150" cy="104" r="5" fill="#3178c6"/><text class="t" x="161" y="108">TypeScript <tspan class="m">24%</tspan></text>
    <circle cx="300" cy="104" r="5" fill="#336791"/><text class="t" x="311" y="108">SQL <tspan class="m">2.4%</tspan></text>
    <circle cx="30" cy="128" r="5" fill="#7b42bc"/><text class="t" x="41" y="132">Terraform <tspan class="m">1.5%</tspan></text>
    <circle cx="150" cy="128" r="5" fill="#8b949e"/><text class="t" x="161" y="132">Other <tspan class="m">1%</tspan></text>
